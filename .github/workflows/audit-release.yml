name: Audit (release)
on:
  pull_request:
    paths:
      - .github/workflows/audit-release.yml
  schedule:
    - cron: 0 1 * * *
  workflow_dispatch: ~

permissions: read-all

jobs:
  deprecations:
    name: Deprecations
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: v0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Insert release configuration
        env:
          NDMRC: ${{ vars.NDMRC }}
        run: |
          echo 'Depreman configuration'
          echo "${NDMRC}" | tee .ndmrc
      - name: Audit deprecation warnings
        run: make audit-deprecations-npm ARGS='--omit dev'
  image:
    name: Image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        id: checkout
        with:
          persist-credentials: false
          ref: v0
      - name: Install tooling
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.64.0
      - name: Insert release configuration
        env:
          GRYPERC: ${{ vars.GRYPERC }}
        run: |
          echo 'Grype configuration'
          echo "${GRYPERC}" | tee .grype.yml
      - name: Audit container dependencies
        run: make audit-vulnerabilities-image
      - name: Upload SBOM and vulnerability scan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          if-no-files-found: error
          name: container-scan-${{ steps.checkout.outputs.commit }}
          path: |
            sbom-syft.json
            vulns.json
  npm:
    name: npm
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: v0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Audit npm dependencies
        run: make audit-vulnerabilities-npm ARGS='--omit dev'
  trigger-release:
    name: Trigger release
    runs-on: ubuntu-26.04
    if: failure()
    needs:
      - image
      - npm
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: main
      - name: Create token to trigger a workflow
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: automation-token
        with:
          client-id: ${{ secrets.AUTOMATION_ID }}
          permission-actions: write # To trigger another workflow
          permission-contents: read
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
      - name: Trigger new release if main is clean
        env:
          GH_TOKEN: ${{ steps.automation-token.outputs.token }}
        run: |
          make audit-vulnerabilities-image
          make audit-vulnerabilities-npm ARGS='--omit dev'
          gh workflow run release.yml -f update_type=patch
