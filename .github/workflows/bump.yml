name: Bump
on:
  schedule:
    - cron: 0 1 * * 1
  workflow_dispatch: ~

permissions: read-all

jobs:
  npm-transitive:
    name: package-lock.json
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Create token to create Pull Request
        uses: actions/create-github-app-token@v3.3.0
        id: automation-token
        with:
          client-id: ${{ secrets.AUTOMATION_ID }}
          permission-contents: write # To push a commit
          permission-pull-requests: write # To open a Pull Request
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
      - name: Install dependencies
        run: npm clean-install
      - name: Update dependencies
        run: |
          npm update --prefer-dedupe
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.automation-token.outputs.token }}
          title: Update transitive dependencies
          body: _This Pull Request was created automatically by running `npm update --prefer-dedupe`._
          labels: dependencies
          add-paths: package.json, package-lock.json
          branch: bump-transitive-npm-dependencies
          commit-message: Bump transitive dependencies
  tooling:
    name: aqua.yml
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Create token to create Pull Request
        uses: actions/create-github-app-token@v3.3.0
        id: automation-token
        with:
          client-id: ${{ secrets.AUTOMATION_ID }}
          permission-contents: write # To push a commit
          permission-pull-requests: write # To open a Pull Request
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
      - name: Install tooling
        uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.65.2
      - name: Update tooling
        run: |
          aqua update
          aqua update-checksum --prune
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.automation-token.outputs.token }}
          title: Bump tool dependencies
          body: _This Pull Request was created automatically by running `aqua update` and `aqua update-checksum`._
          labels: dependencies
          add-paths: aqua.yml, aqua-checksums.json
          branch: bump-tool-dependencies
          commit-message: Bump tools with aqua
