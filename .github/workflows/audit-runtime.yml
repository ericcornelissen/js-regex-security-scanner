name: Audit
on:
  pull_request:
    paths:
      - .cve-lite/baseline.json
      - .github/workflows/audit-runtime.yml
      - .grype.yml
      - .ndmrc
      - .syft.yml
      - Containerfile
      - package-lock.json
  push:
    branches:
      - main

permissions: read-all

jobs:
  audit:
    name: Runtime
    uses: $/.github/workflows/reusable-audit.yml
    with:
      dev: false
