name: Nightly
on:
  pull_request:
    paths:
      - .github/workflows/nightly.yml
  schedule:
    - cron: 0 1 * * *
  workflow_dispatch: ~

permissions: read-all

jobs:
  reproducible-builds:
    name: Reproduce latest release
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        id: checkout
        with:
          persist-credentials: false
          ref: v0
      - name: Install tooling
        uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.65.2
      - name: Build latest image
        run: TAG=rebuild ENGINE_OPTIONS=--no-cache make build
      - name: Pull published image
        run: docker pull docker.io/ericornelissen/js-re-scan:latest
      - name: Diff images
        run: |
          diffoci diff --semantic \
            --report-dir ./image-diff \
            docker://docker.io/ericornelissen/js-re-scan:latest \
            docker://docker.io/ericornelissen/js-re-scan:rebuild
      - name: Upload report
        uses: actions/upload-artifact@v7.0.0
        if: failure()
        with:
          if-no-files-found: error
          name: diffoci-scan-${{ steps.checkout.outputs.commit }}
          path: image-diff
